# Place this in the server block for triage.carein.cloud
# (or inside the active PHP location handling /api).
#
# Goal: ensure OPTIONS preflight receives CORS headers before upstream handling.

location /api/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://on.dev.chereh.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, X-Requested-With" always;
        add_header Vary "Origin" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    try_files $uri $uri/ /index.php?$query_string;
}
